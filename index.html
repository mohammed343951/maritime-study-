<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Something Special For Balbol ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #13070e;
            --bg-accent: #270e1d;
            --rose-gold: #f4acb7;
            --rose-primary: #e0456b;
            --rose-glow: rgba(224, 69, 107, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(244, 172, 183, 0.22);
            --text-main: #fdf8f9;
            --text-muted: #d8b4be;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Alexandria', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top right, #331024 0%, #13070e 60%, #0b0408 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
            overflow: hidden;
            position: relative;
            color: var(--text-main);
        }

        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(85px);
            opacity: 0.45;
            z-index: 0;
            animation: floatOrb 10s infinite alternate ease-in-out;
        }
        .orb-1 {
            width: 280px;
            height: 280px;
            background: #d93860;
            top: -60px;
            right: -60px;
        }
        .orb-2 {
            width: 240px;
            height: 240px;
            background: #9d4edd;
            bottom: -50px;
            left: -50px;
            animation-delay: -5s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-25px, 25px) scale(1.12); }
        }

        .quiz-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            width: 100%;
            max-width: 430px;
            min-height: 560px;
            border-radius: 32px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.15);
            padding: 28px 24px;
            text-align: center;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
        }

        .progress-bar-track {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
        }

        .progress-bar-fill {
            height: 100%;
            width: 15%;
            background: linear-gradient(90deg, var(--rose-gold), var(--rose-primary));
            box-shadow: 0 0 12px var(--rose-primary);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .step-badge {
            background: rgba(244, 172, 183, 0.12);
            color: var(--rose-gold);
            border: 1px solid rgba(244, 172, 183, 0.3);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-top: 6px;
            margin-bottom: 10px;
        }

        .bear-stage {
            width: 175px;
            height: 175px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.01) 75%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 12px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .bear-container {
            width: 165px;
            height: 165px;
            position: relative;
            transition: transform 0.35s ease;
        }

        .bear-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3));
        }

        .brows-annoyed,
        .mouth-annoyed,
        .arms-crossed,
        .anger-mark,
        .eye-wink,
        .mouth-smile,
        .rose-group,
        .hearts-group {
            display: none;
        }

        .bear-normal .mouth-normal,
        .bear-normal .arms-normal,
        .bear-normal .eye-left-open {
            display: block;
        }

        .bear-happy {
            animation: floatHappy 0.7s infinite alternate ease-in-out;
        }
        .bear-happy .mouth-smile,
        .bear-happy .arms-normal,
        .bear-happy .hearts-group,
        .bear-happy .eye-left-open {
            display: block;
        }

        .bear-annoyed {
            animation: shakeBear 0.4s ease;
        }
        .bear-annoyed .brows-annoyed,
        .bear-annoyed .mouth-annoyed,
        .bear-annoyed .arms-crossed,
        .bear-annoyed .anger-mark,
        .bear-annoyed .eye-left-open {
            display: block;
        }
        .bear-annoyed .arms-normal,
        .bear-annoyed .mouth-normal {
            display: none;
        }

        .bear-romantic {
            animation: pulseBear 0.85s infinite alternate ease-in-out;
        }
        .bear-romantic .eye-left-open,
        .bear-romantic .mouth-normal {
            display: none;
        }
        .bear-romantic .eye-wink,
        .bear-romantic .mouth-smile,
        .bear-romantic .arms-normal,
        .bear-romantic .rose-group,
        .bear-romantic .hearts-group {
            display: block;
        }

        @keyframes floatHappy {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }
        @keyframes shakeBear {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-7px) rotate(-2deg); }
            75% { transform: translateX(7px) rotate(2deg); }
        }
        @keyframes pulseBear {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .question-title {
            font-size: 1.25rem;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.65;
            padding: 0 5px;
        }

        .content-area {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .buttons-arena {
            width: 100%;
            height: 150px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
        }

        .btn {
            padding: 13px 36px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
        }

        .btn-yes {
            background: linear-gradient(135deg, #e0456b 0%, #b8254b 100%);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 25px var(--rose-glow);
            z-index: 2;
        }

        .btn-yes:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(224, 69, 107, 0.55);
        }

        .btn-yes:active {
            transform: scale(0.96);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            position: relative;
            transition: all 0.18s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 3;
        }

        .soap-bubble {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.85), rgba(244, 172, 183, 0.25));
            border: 1px solid rgba(255,255,255,0.5);
            pointer-events: none;
            animation: floatBubble 0.75s ease-out forwards;
            z-index: 10;
        }

        @keyframes floatBubble {
            0% { transform: scale(0.4); opacity: 1; }
            100% { transform: translateY(-38px) scale(1.5); opacity: 0; }
        }

        .food-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
        }

        .upload-box {
            width: 100%;
            height: 145px;
            border: 1.5px dashed rgba(244, 172, 183, 0.45);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: all 0.25s ease;
        }

        .upload-box:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--rose-gold);
        }

        .file-overlay-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 20;
        }

        .upload-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            pointer-events: none;
        }

        .upload-placeholder {
            color: var(--rose-gold);
            font-weight: 400;
            font-size: 0.9rem;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .upload-placeholder span.icon {
            font-size: 1.6rem;
            opacity: 0.9;
        }

        .text-input {
            width: 100%;
            padding: 13px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(244, 172, 183, 0.25);
            border-radius: 16px;
            font-size: 0.95rem;
            color: #fff;
            text-align: center;
            outline: none;
            transition: all 0.25s;
            user-select: text;
            -webkit-user-select: text;
        }

        .text-input::placeholder {
            color: rgba(216, 180, 190, 0.55);
        }

        .text-input:focus {
            border-color: var(--rose-gold);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(244, 172, 183, 0.15);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin-bottom: 14px;
        }

        .option-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 16px 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .option-card:hover {
            background: rgba(255, 255, 255, 0.09);
        }

        .option-icon {
            font-size: 1.85rem;
        }

        .option-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .option-card.selected {
            background: rgba(224, 69, 107, 0.22);
            border-color: var(--rose-gold);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(224, 69, 107, 0.25);
        }

        .option-card.rejected {
            background: rgba(220, 38, 38, 0.15);
            border-color: rgba(248, 113, 113, 0.6);
            animation: shakeBear 0.4s ease;
        }

        .rejected-badge {
            background: #e11d48;
            color: #fff;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 12px;
            position: absolute;
            top: 7px;
            left: 7px;
        }

        .error-msg {
            color: #fda4af;
            font-size: 0.82rem;
            font-weight: 400;
            min-height: 22px;
            margin-top: 2px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="ambient-orb orb-1"></div>
<div class="ambient-orb orb-2"></div>

<div class="quiz-card" id="quizCard">
    <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBar"></div>
    </div>

    <div class="step-badge" id="stepBadge">مـسـتـعـدة يـا بـلـبـل؟ ✨</div>

    <div class="bear-stage">
        <div class="bear-container bear-normal" id="bear">
            <svg class="bear-svg" viewBox="0 0 200 200">
                <g class="hearts-group">
                    <path d="M35 45 C35 38, 25 38, 25 45 C25 38, 15 38, 15 45 C15 53, 25 58, 25 63 C25 58, 35 53, 35 45 Z" fill="#e0456b"/>
                    <path d="M180 40 C180 33, 170 33, 170 40 C170 33, 160 33, 160 40 C160 48, 170 53, 170 58 C170 53, 180 48, 180 40 Z" fill="#f4acb7"/>
                </g>

                <g class="anger-mark" stroke="#fb7185" stroke-width="3" stroke-linecap="round" fill="none">
                    <path d="M145 35 Q155 45 145 55" />
                    <path d="M165 35 Q155 45 165 55" />
                    <path d="M147 33 Q155 43 163 33" />
                    <path d="M147 57 Q155 47 163 57" />
                </g>

                <circle cx="55" cy="52" r="21" fill="#ffffff" stroke="#e2d9dc" stroke-width="3"/>
                <circle cx="55" cy="52" r="11" fill="#f4acb7" opacity="0.75"/>
                <circle cx="145" cy="52" r="21" fill="#ffffff" stroke="#e2d9dc" stroke-width="3"/>
                <circle cx="145" cy="52" r="11" fill="#f4acb7" opacity="0.75"/>

                <ellipse cx="100" cy="155" rx="50" ry="40" fill="#ffffff" stroke="#e2d9dc" stroke-width="3"/>
                <ellipse cx="100" cy="158" rx="30" ry="24" fill="#fdf2f4"/>

                <circle cx="100" cy="95" r="54" fill="#ffffff" stroke="#e2d9dc" stroke-width="3"/>

                <ellipse cx="62" cy="103" rx="10" ry="6" fill="#f4acb7" opacity="0.65"/>
                <ellipse cx="138" cy="103" rx="10" ry="6" fill="#f4acb7" opacity="0.65"/>

                <circle cx="75" cy="88" r="6" fill="#2b1922"/>
                <circle cx="73" cy="85.5" r="2" fill="#ffffff"/>

                <g class="eye-left-open">
                    <circle cx="125" cy="88" r="6" fill="#2b1922"/>
                    <circle cx="123" cy="85.5" r="2" fill="#ffffff"/>
                </g>

                <path class="eye-wink" d="M115 88 Q125 79 135 88" fill="none" stroke="#2b1922" stroke-width="3.5" stroke-linecap="round"/>

                <g class="brows-annoyed" stroke="#2b1922" stroke-width="4" stroke-linecap="round">
                    <line x1="64" y1="73" x2="84" y2="80"/>
                    <line x1="136" y1="73" x2="116" y2="80"/>
                </g>

                <ellipse cx="100" cy="103" rx="15" ry="12" fill="#fcf5f7" stroke="#ece2e5" stroke-width="1.5"/>
                <ellipse cx="100" cy="98" rx="6" ry="4" fill="#2b1922"/>

                <path class="mouth-normal" d="M93 106 Q100 112 107 106" fill="none" stroke="#2b1922" stroke-width="2.8" stroke-linecap="round"/>
                <path class="mouth-smile" d="M91 104 Q100 116 109 104 Z" fill="#e0456b" stroke="#2b1922" stroke-width="2.2"/>
                <path class="mouth-annoyed" d="M92 111 Q100 103 108 111" fill="none" stroke="#2b1922" stroke-width="3" stroke-linecap="round"/>

                <g class="arms-normal">
                    <ellipse cx="52" cy="148" rx="13" ry="23" transform="rotate(20 52 148)" fill="#ffffff" stroke="#e2d9dc" stroke-width="3"/>
                    <ellipse cx="148" cy="148" rx="13" ry="23" transform="rotate(-20 148 148)" fill="#ffffff" stroke="#e2d9dc" stroke-width="3"/>
                </g>

                <g class="arms-crossed">
                    <ellipse cx="88" cy="146" rx="27" ry="12.5" transform="rotate(18 88 146)" fill="#ffffff" stroke="#e2d9dc" stroke-width="3"/>
                    <ellipse cx="112" cy="148" rx="27" ry="12.5" transform="rotate(-18 112 148)" fill="#ffffff" stroke="#e2d9dc" stroke-width="3"/>
                </g>

                <g class="rose-group">
                    <path d="M75 108 Q115 112 155 125" fill="none" stroke="#38b000" stroke-width="3.5" stroke-linecap="round"/>
                    <path d="M125 115 Q132 105 140 117 Q130 122 125 115 Z" fill="#38b000"/>
                    <circle cx="68" cy="107" r="10.5" fill="#d90429"/>
                    <path d="M62 103 Q68 98 74 105 Q68 114 62 103 Z" fill="#9b001a"/>
                    <circle cx="66" cy="105" r="3.8" fill="#ff4d6d"/>
                </g>
            </svg>
        </div>
    </div>

    <h2 class="question-title" id="questionTitle">
        جاهزة تبدأي يا بلبل بأسئلة ما فيها تراجع؟ ✨
    </h2>

    <div class="content-area">
        <div class="buttons-arena" id="yesNoArena">
            <button class="btn btn-yes" id="yesBtn" onclick="handleYesClick()">Yes</button>
            <button class="btn btn-no" id="noBtn">No</button>
        </div>

        <div class="food-form hidden" id="foodArena">
            <div class="upload-box">
                <input type="file" id="foodImageInput" accept="image/*" class="file-overlay-input" onchange="previewFoodImage(event)">
                <img id="foodPreview" alt="صورة الأكلة">
                <div class="upload-placeholder" id="uploadPlaceholder">
                    <span class="icon">📸</span>
                    <span>اضغطي هون لترفعي صورة أكلتك المفضلة يا بلبل</span>
                </div>
            </div>
            <input type="text" id="foodNameInput" class="text-input" placeholder="اكتبي اسم الأكلة هون...">
            <div class="error-msg" id="foodError"></div>
            <button class="btn btn-yes" onclick="submitFoodQuestion()">متابعة</button>
        </div>

        <div class="hidden" id="wishArena" style="width: 100%;">
            <div class="options-grid">
                <div class="option-card" id="opt-travel" onclick="toggleWishOption('travel')">
                    <span class="option-icon">✈️</span>
                    <span class="option-title">نسافر سوا</span>
                </div>
                <div class="option-card" id="opt-cinema" onclick="rejectOption('cinema')">
                    <span class="option-icon">🎬</span>
                    <span class="option-title">نروح ع السينما</span>
                </div>
                <div class="option-card" id="opt-marry" onclick="rejectOption('marry')">
                    <span class="option-icon">💍</span>
                    <span class="option-title">نتجوز</span>
                </div>
                <div class="option-card" id="opt-mountain" onclick="toggleWishOption('mountain')">
                    <span class="option-icon">🪂</span>
                    <span class="option-title">ننط من فوق جبل</span>
                </div>
            </div>
            <div class="error-msg" id="wishError"></div>
            <button class="btn btn-yes" onclick="submitWishQuestion()">متابعة</button>
        </div>
    </div>
</div>

<script>
    const TELEGRAM_BOT_TOKEN = "8779119649:AAGzYQhf9ZsuyOrZzoglgrG2g3rnlYYvKA4"; 
    const TELEGRAM_CHAT_ID = "5027168810";

    let currentStep = 0;

    const answers = {
        no_attempts: 0,
        q1_love: "Yes ❤️",
        food_name: "",
        food_blob: null,
        q3_love: "Yes ❤️",
        wishes: [],
        rejected_attempts: [],
        final_love: "Yes ❤️"
    };

    const bear = document.getElementById('bear');
    const stepBadge = document.getElementById('stepBadge');
    const progressBar = document.getElementById('progressBar');
    const questionTitle = document.getElementById('questionTitle');
    const yesNoArena = document.getElementById('yesNoArena');
    const foodArena = document.getElementById('foodArena');
    const wishArena = document.getElementById('wishArena');
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');

    async function sendTelegramText(text) {
        try {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: text
                })
            });
        } catch (err) {
            console.error("خطأ بإرسال الرسالة:", err);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        sendTelegramText("🔔 البلانص (بلبل) فتحت رابط الموقع هلق وعم تقرأ البداية يا عريس! 👀❤️");
    });

    function setBearState(state) {
        bear.className = 'bear-container bear-' + state;
    }

    function slipNoButton(e) {
        if (e) e.preventDefault();

        answers.no_attempts++;
        setBearState('annoyed');

        const bubble = document.createElement('div');
        bubble.className = 'soap-bubble';
        bubble.style.left = (noBtn.offsetLeft + 25) + 'px';
        bubble.style.top = (noBtn.offsetTop + 10) + 'px';
        yesNoArena.appendChild(bubble);
        setTimeout(() => bubble.remove(), 750);

        const arenaRect = yesNoArena.getBoundingClientRect();
        const btnWidth = noBtn.offsetWidth;
        const btnHeight = noBtn.offsetHeight;

        const maxX = Math.max(10, arenaRect.width - btnWidth - 10);
        const maxY = Math.max(10, arenaRect.height - btnHeight - 10);

        const randomX = Math.max(5, Math.floor(Math.random() * maxX));
        const randomY = Math.max(5, Math.floor(Math.random() * maxY));

        noBtn.style.position = 'absolute';
        noBtn.style.left = randomX + 'px';
        noBtn.style.top = randomY + 'px';
    }

    noBtn.addEventListener('mouseover', slipNoButton);
    noBtn.addEventListener('touchstart', slipNoButton, { passive: false });
    noBtn.addEventListener('click', slipNoButton);

    function resetNoButtonPosition() {
        noBtn.style.position = 'relative';
        noBtn.style.left = 'auto';
        noBtn.style.top = 'auto';
    }

    function handleYesClick() {
        yesBtn.disabled = true;

        if (currentStep === 0) {
            setBearState('happy');
            setTimeout(() => {
                currentStep = 1;
                renderStep();
            }, 1000);
        } 
        else if (currentStep === 1 || currentStep === 3 || currentStep === 6) {
            setBearState('romantic');
            setTimeout(() => {
                if (currentStep === 1) {
                    currentStep = 2;
                    renderStep();
                } else if (currentStep === 3) {
                    currentStep = 4;
                    renderStep();
                } else if (currentStep === 6) {
                    finishQuiz();
                }
            }, 1850);
        } 
        else if (currentStep === 5) {
            setBearState('happy');
            setTimeout(() => {
                currentStep = 6;
                renderStep();
            }, 950);
        }
    }

    function renderStep() {
        yesBtn.disabled = false;
        resetNoButtonPosition();
        setBearState('normal');

        yesNoArena.classList.add('hidden');
        foodArena.classList.add('hidden');
        wishArena.classList.add('hidden');

        const progressMap = { 1: "25%", 2: "45%", 3: "60%", 4: "75%", 5: "90%", 6: "100%" };
        progressBar.style.width = progressMap[currentStep] || "15%";

        if (currentStep === 1) {
            stepBadge.textContent = "السؤال الأول • بلبل ❤️";
            questionTitle.textContent = "بتحبيني يا بلبل؟ 🥺❤️";
            yesNoArena.classList.remove('hidden');
        } 
        else if (currentStep === 2) {
            stepBadge.textContent = "السؤال الثاني • بلبل 🍔";
            questionTitle.textContent = "شو أكتر أكلة بتحبيها يا قلبي؟ 😋";
            foodArena.classList.remove('hidden');
        } 
        else if (currentStep === 3) {
            stepBadge.textContent = "السؤال الثالث • بلبل 💓";
            questionTitle.textContent = "نرجع نسأل.. متأكدة بتحبيني يا بلبل؟ 👀❤️";
            yesNoArena.classList.remove('hidden');
        } 
        else if (currentStep === 4) {
            stepBadge.textContent = "السؤال الرابع • بلبل ✨";
            questionTitle.textContent = "شو أكتر شغلة بتتمني تعمليها معي يا بلبل؟ 😍";
            wishArena.classList.remove('hidden');
        } 
        else if (currentStep === 5) {
            stepBadge.textContent = "لحظة حاسمة • بلبل ⚠️";
            questionTitle.textContent = "متأكدة بدك تنتقلي للسؤال الأخير يا بلبل؟ 🫣";
            yesNoArena.classList.remove('hidden');
        } 
        else if (currentStep === 6) {
            stepBadge.textContent = "السؤال الأخير • بلبل 💍❤️";
            questionTitle.textContent = "والسؤال الأهم.. بتحبيني كتيير يا بلبل؟ 😘❤️";
            yesNoArena.classList.remove('hidden');
        }
    }

    function previewFoodImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const imgElement = document.getElementById('foodPreview');
            imgElement.src = e.target.result;
            imgElement.style.display = 'block';
            document.getElementById('uploadPlaceholder').style.display = 'none';

            const tempImg = new Image();
            tempImg.onload = function() {
                const canvas = document.createElement('canvas');
                const maxDim = 900;
                let w = tempImg.width;
                let h = tempImg.height;
                if (w > maxDim || h > maxDim) {
                    if (w > h) {
                        h = Math.round((h * maxDim) / w);
                        w = maxDim;
                    } else {
                        w = Math.round((w * maxDim) / h);
                        h = maxDim;
                    }
                }
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(tempImg, 0, 0, w, h);
                canvas.toBlob((blob) => {
                    answers.food_blob = blob || file;
                }, 'image/jpeg', 0.82);
            };
            tempImg.src = e.target.result;
        };
        reader.readAsDataURL(file);
        document.getElementById('foodError').textContent = "";
    }

    function submitFoodQuestion() {
        const fileInput = document.getElementById('foodImageInput');
        const foodName = document.getElementById('foodNameInput').value.trim();
        const errorEl = document.getElementById('foodError');
        const hasPhoto = fileInput.files.length > 0 || answers.food_blob !== null;

        if (!hasPhoto && !foodName) {
            setBearState('annoyed');
            errorEl.textContent = "ما فيكي تتخطي يا بلبل! ارفعي الصورة واكتبي اسم الأكلة 😤";
            return;
        }
        if (!hasPhoto) {
            setBearState('annoyed');
            errorEl.textContent = "ضروري ترفعي صورة الأكلة يا بلبل! 📸";
            return;
        }
        if (!foodName) {
            setBearState('annoyed');
            errorEl.textContent = "اكتبي شو اسم الأكلة بالفراغ تحت الصورة! ✍️";
            return;
        }

        answers.food_name = foodName;
        setBearState('happy');
        setTimeout(() => {
            currentStep = 3;
            renderStep();
        }, 850);
    }

    const selectedWishes = new Set();

    function toggleWishOption(optionKey) {
        const card = document.getElementById('opt-' + optionKey);
        document.getElementById('wishError').textContent = "";

        if (selectedWishes.has(optionKey)) {
            selectedWishes.delete(optionKey);
            card.classList.remove('selected');
        } else {
            selectedWishes.add(optionKey);
            card.classList.add('selected');
            setBearState('happy');
        }
    }

    function rejectOption(optionKey) {
        const card = document.getElementById('opt-' + optionKey);
        const errorEl = document.getElementById('wishError');

        setBearState('annoyed');
        card.classList.add('rejected');

        if (!card.querySelector('.rejected-badge')) {
            const badge = document.createElement('span');
            badge.className = 'rejected-badge';
            badge.textContent = 'مرفوض ✕';
            card.appendChild(badge);
        }

        const label = optionKey === 'marry' ? 'نتجوز 💍' : 'نروح ع السينما 🎬';
        if (!answers.rejected_attempts.includes(label)) {
            answers.rejected_attempts.push(label);
        }

        errorEl.textContent = "مرفوض يا بلبل! 😜 اختاري شي تاني";
    }

    function submitWishQuestion() {
        const errorEl = document.getElementById('wishError');

        if (selectedWishes.size === 0) {
            setBearState('annoyed');
            errorEl.textContent = "لازم تختاري (نسافر سوا ✈️) أو (ننط من فوق جبل 🪂) يا بلبل!";
            return;
        }

        answers.wishes = Array.from(selectedWishes).map(k => 
            k === 'travel' ? 'نسافر سوا ✈️' : 'ننط من فوق جبل 🪂'
        );

        setBearState('happy');
        setTimeout(() => {
            currentStep = 5;
            renderStep();
        }, 850);
    }

    async function finishQuiz() {
        stepBadge.textContent = "تم بنجاح يا بلبل 🎉";
        questionTitle.innerHTML = "وأنا بحبك أكتر بكتييير يا بلبل! ❤️🌹<br><span style='font-size:0.9rem;color:#d8b4be;font-weight:300;display:block;margin-top:8px;'>وصلتني كل أجوبتك الحلوة 😘</span>";
        yesNoArena.classList.add('hidden');
        setBearState('romantic');

        const reportText = 
`💌 وصلتني أجوبة بلبل كاملة من الموقع!

1️⃣ السؤال الأول (بتحبيني؟): ${answers.q1_love}
2️⃣ أكتر أكلة بتحبها: ${answers.food_name}
3️⃣ السؤال الثالث (بتحبيني؟): ${answers.q3_love}
4️⃣ شو بتتمنى تعمل معك: ${answers.wishes.join(' + ')}
🚫 خيارات مرفوضة كبست عليها: ${answers.rejected_attempts.length ? answers.rejected_attempts.join(' ، ') : 'ما كبست ع المرفوض'}
5️⃣ السؤال الأخير (بتحبيني؟): ${answers.final_love}
🧼 عدد محاولات الكبس ع زر No الزحليقة: ${answers.no_attempts} مرة`;

        const photoToUpload = answers.food_blob || document.getElementById('foodImageInput').files[0];

        try {
            if (photoToUpload) {
                const formData = new FormData();
                formData.append("chat_id", TELEGRAM_CHAT_ID);
                formData.append("photo", photoToUpload, "food.jpg");
                formData.append("caption", reportText);

                const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                    method: "POST",
                    body: formData
                });

                if (!res.ok) {
                    await sendTelegramText(reportText);
                }
            } else {
                await sendTelegramText(reportText);
            }
        } catch (err) {
            await sendTelegramText(reportText);
        }
    }
</script>
